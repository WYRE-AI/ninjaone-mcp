

services:
  # Gateway mode. Client id and secret arrive per request on X-Ninja-* headers.
  # Do not set NINJAONE_CLIENT_ID, NINJAONE_CLIENT_SECRET, or env_file here —
  # that would put static vendor credentials in the container. The project .env
  # is used only for Compose interpolation of CONDUIT_S2S_SECRET (and optional
  # non-secret settings). For AUTH_MODE=env, pass NINJAONE_CLIENT_ID and
  # NINJAONE_CLIENT_SECRET on that process instead (see the README).
  ninjaone-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ninjaone-mcp:latest
    container_name: ninjaone-mcp-server
    restart: unless-stopped
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      # Region is not a credential. Per-request X-Ninja-Region overrides it.
      - NINJAONE_REGION=${NINJAONE_REGION:-us}
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-ninjaone-mcp}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Mount logs directory for persistence
      - ninjaone-mcp-logs:/app/logs

    # 127.0.0.1, not localhost: localhost resolves to ::1 in the container, and
    # the IPv4-only MCP_HTTP_HOST=0.0.0.0 bind refuses that connection. $$ keeps
    # Compose from substituting the port on the host; the container shell reads
    # MCP_HTTP_PORT (default 8080).
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:$${MCP_HTTP_PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits for production use
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Development service - runs once for testing, doesn't restart
  ninjaone-mcp-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: ninjaone-mcp:dev
    container_name: ninjaone-mcp-dev
    working_dir: /app
    restart: "no"
    command: npm run dev
    environment:
      # Development environment variables
      - NODE_ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-debug}

      # NinjaOne credentials
      - NINJAONE_CLIENT_ID=${NINJAONE_CLIENT_ID}
      - NINJAONE_CLIENT_SECRET=${NINJAONE_CLIENT_SECRET}
      - NINJAONE_REGION=${NINJAONE_REGION:-us}
    env_file:
      - .env
    volumes:
      # Mount source code for hot reload in development
      - .:/app
      - /app/node_modules
      - ninjaone-mcp-dev-logs:/app/logs
    stdin_open: true
    tty: true

volumes:
  ninjaone-mcp-logs:
    driver: local
  ninjaone-mcp-dev-logs:
    driver: local

# Copy .env.example. Compose interpolates CONDUIT_S2S_SECRET from that file
# and refuses to start the gateway service when it is unset. Do not put
# NINJAONE_CLIENT_ID or NINJAONE_CLIENT_SECRET on the gateway service.
# CONDUIT_S2S_SECRET=
# NINJAONE_REGION=us
# LOG_LEVEL=info
